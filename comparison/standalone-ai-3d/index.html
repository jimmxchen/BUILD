<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChatGPT one-shot house · 3D comparison</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #111c1c; color: #f4f2e9; }
    header { position: absolute; z-index: 2; top: 24px; left: 28px; max-width: 470px; pointer-events: none; }
    .eyebrow { color: #b2d1c7; font-size: 12px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
    h1 { font-size: clamp(24px, 3vw, 40px); letter-spacing: -.04em; margin: 8px 0; }
    p { color: #c0cec9; line-height: 1.5; margin: 0; }
    canvas { display: block; width: 100vw; height: 100vh; cursor: grab; touch-action: none; }
    canvas:active { cursor: grabbing; }
    .controls { position: absolute; right: 24px; bottom: 24px; display: flex; gap: 8px; z-index: 2; }
    button { background: #e6d5ac; border: 0; border-radius: 8px; color: #1d2a27; cursor: pointer; font: inherit; font-size: 13px; font-weight: 700; padding: 10px 13px; }
    .hint { position: absolute; bottom: 28px; left: 28px; color: #b7c6bf; font-size: 12px; pointer-events: none; }
    @media (max-width: 720px) { header { left: 18px; top: 16px; right: 18px; } .hint { display: none; } .controls { right: 16px; bottom: 16px; } }
  </style>
</head>
<body>
  <header><div class="eyebrow">Standalone ChatGPT concept · 1,800 sq ft</div><h1>A home from one prompt</h1><p>3 beds · 2 baths · open kitchen · home office</p></header>
  <canvas id="scene" aria-label="Interactive three-dimensional cutaway model of a single-story house"></canvas>
  <div class="hint">Drag to orbit · Scroll to zoom · Doors are gaps in the walls</div>
  <div class="controls"><button id="reset">Reset view</button><button id="save">Save PNG</button></div>
  <script type="module" src="./scene.js"></script>
</body>
</html>
